name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: Code Quality & Syntax Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Validate PHP syntax
        run: |
          php -l config.example.php
          php -l api/get_leaderboard.php
          php -l api/submit_score.php

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JavaScript and Manifest
        run: |
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("index.html", "utf8");
            const match = html.match(/<script>([\s\S]*?)<\/script>/i);
            if (!match) throw new Error("No script tag found in index.html");
            new Function(match[1]);
            console.log("✓ JavaScript syntax valid");

            const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            if (!manifest.name || !manifest.icons) throw new Error("Invalid manifest.json");
            console.log("✓ PWA Manifest valid");
          '
