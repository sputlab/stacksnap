<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f1c"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7eb6"/>
      <stop offset="100%" stop-color="#ff3366"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Ambient glows -->
  <circle cx="256" cy="180" r="85" fill="#ff3366" opacity="0.25" filter="url(#glow)"/>
  <circle cx="256" cy="265" r="85" fill="#06b6d4" opacity="0.22" filter="url(#glow)"/>
  <circle cx="256" cy="350" r="85" fill="#f59e0b" opacity="0.25" filter="url(#glow)"/>
  <!-- Base block -->
  <g filter="url(#glow)">
    <rect x="106" y="324" width="300" height="74" rx="20" fill="url(#amber)" stroke="#fff" stroke-width="4" stroke-opacity="0.75"/>
    <rect x="114" y="330" width="284" height="12" rx="6" fill="#ffffff" fill-opacity="0.45"/>
  </g>
  <!-- Middle block -->
  <g filter="url(#glow)">
    <rect x="136" y="234" width="240" height="74" rx="20" fill="url(#cyan)" stroke="#fff" stroke-width="4" stroke-opacity="0.75"/>
    <rect x="144" y="240" width="224" height="12" rx="6" fill="#ffffff" fill-opacity="0.45"/>
  </g>
  <!-- Top block -->
  <g filter="url(#glow)">
    <rect x="166" y="144" width="180" height="74" rx="20" fill="url(#coral)" stroke="#fff" stroke-width="4" stroke-opacity="0.75"/>
    <rect x="174" y="150" width="164" height="12" rx="6" fill="#ffffff" fill-opacity="0.45"/>
  </g>
</svg>
